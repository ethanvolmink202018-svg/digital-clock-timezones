<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕐 Digital Clock</h1>
            <p>Current Time Across the World</p>
        </div>

        <div class="controls">
            <div class="time-format-toggle">
                <label>Time Format:</label>
                <button class="format-btn active" data-format="12">12 Hour</button>
                <button class="format-btn" data-format="24">24 Hour</button>
            </div>
            <div class="search-box">
                <input 
                    type="text" 
                    id="timezoneSearch" 
                    placeholder="🔍 Search time zones..."
                    class="search-input"
                >
            </div>
        </div>

        <div class="main-clock">
            <div class="local-time">
                <div class="time-display" id="localTime">00:00:00</div>
                <div class="timezone-label" id="localTimezone">Local Time</div>
                <div class="date-display" id="localDate">Monday, January 1, 2024</div>
            </div>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be inserted here by JavaScript -->
        </div>

        <div class="add-timezone">
            <button class="add-btn" id="addTimezoneBtn">+ Add Custom Time Zone</button>
        </div>
    </div>

    <!-- Modal for adding custom timezone -->
    <div class="modal" id="timezoneModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Custom Time Zone</h2>
            <select id="timezoneSelect" class="timezone-select">
                <!-- Options will be populated by JavaScript -->
            </select>
            <button class="modal-btn" id="confirmAddTimezone">Add Time Zone</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
